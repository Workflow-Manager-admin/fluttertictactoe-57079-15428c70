name: tic_tac_toe_frontend
description: >
  A minimalistic two-player tic-tac-toe game built with Flutter. Responsive, light-themed, and easy to play.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
